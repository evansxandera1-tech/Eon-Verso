name: Laboratorio Mental - YouTube independiente

on:
  push:
    branches: [main]
    paths:
      - 'laboratorio_mental/solicitud_publicacion.txt'
  workflow_dispatch:
    inputs:
      modo:
        description: "Primero identificar, luego verificar y finalmente publicar"
        type: choice
        required: true
        default: identificar
        options:
          - identificar
          - verificar
          - publicar
      video:
        description: "Video limpio en Drive > Laboratorio Mental > Publicar; SRT ES, EN y miniatura se cargan automaticamente"
        type: string
        required: true
        default: "Laboratorio_Mental_Excusas_SIN_SUBS_540p.mp4"
      titulo:
        description: "Título del video en YouTube"
        type: string
        required: true
        default: "Cómo Dejar las Excusas y Desarrollar Disciplina | Inspirado en Brian Tracy"
      privacidad:
        description: "Visibilidad; por seguridad inicialmente privado"
        type: choice
        default: private
        options:
          - private
          - unlisted
          - public

permissions:
  contents: write

concurrency:
  group: laboratorio-mental-youtube
  cancel-in-progress: false

jobs:
  youtube:
    name: Verificar canal y adjuntar miniatura y 2 pistas de subtitulos
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      LAB_YOUTUBE_CLIENT_ID: ${{ secrets.LAB_YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
      LAB_YOUTUBE_CLIENT_SECRET: ${{ secrets.LAB_YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
      LAB_YOUTUBE_REFRESH_TOKEN: ${{ secrets.LAB_YOUTUBE_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias YouTube
        run: pip install --disable-pip-version-check requests google-auth google-api-python-client
      - name: Preparar rclone solo para videos
        if: ${{ inputs.modo != 'identificar' }}
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Conectar Google Drive solo para videos
        if: ${{ inputs.modo != 'identificar' }}
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          test -n "$RCLONE_CONFIG_BASE64" || (echo "::error::Falta RCLONE_CONFIG_BASE64" && exit 1)
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes | grep -Fx 'gdrive:'
      - name: Identificar, verificar o publicar
        shell: bash
        env:
          MODO: ${{ inputs.modo || 'publicar' }}
          VIDEO: ${{ inputs.video || 'Laboratorio_Mental_Excusas_SIN_SUBS_540p.mp4' }}
          TITULO: ${{ inputs.titulo || 'Cómo Dejar las Excusas y Desarrollar Disciplina | Inspirado en Brian Tracy' }}
          PRIVACIDAD: ${{ inputs.privacidad || 'private' }}
        run: |
          python laboratorio_mental_publicar.py \
            --modo "$MODO" \
            --video "$VIDEO" \
            --titulo "$TITULO" \
            --privacidad "$PRIVACIDAD"
