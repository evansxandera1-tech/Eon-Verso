name: EON-Verso - Documental Oceano YouTube y Facebook
on:
  push:
    paths:
      - ".github/workflows/publicar_oceano.yml"
      - "eon_oceano_publicador.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eon-oceano-documental-publicacion
  cancel-in-progress: false
jobs:
  publicar:
    name: Verificar fuentes, canal y pagina
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configurar Drive
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          test -n "$RCLONE_CONFIG_BASE64" || (echo "::error::Falta RCLONE_CONFIG_BASE64" && exit 1)
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes | grep -Fx 'gdrive:'
      - name: Instalar dependencias
        run: pip install --disable-pip-version-check requests google-auth google-api-python-client
      - name: Ejecutar publicador de Océano
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python eon_oceano_publicador.py --mode publish
