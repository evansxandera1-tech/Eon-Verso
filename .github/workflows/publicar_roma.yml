name: EON-Verso - Publicar ROMA en YouTube
on:
  push:
    branches: [main]
    paths:
      - "roma_publish_once.trigger"
  workflow_dispatch:
    inputs:
      modo:
        description: "verify comprueba archivos; publish publica una sola vez"
        type: choice
        options: [verify, publish]
        default: verify
        required: true
permissions:
  contents: write
concurrency:
  group: eon-roma-publicacion
  cancel-in-progress: false
jobs:
  publicar_roma:
    name: Publicar ROMA solo voz en EON-Verso
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Conectar Drive
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          test -n "$RCLONE_CONFIG_BASE64" || (echo "::error::Falta RCLONE_CONFIG_BASE64" && exit 1)
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes | grep -Fx 'gdrive:'
      - name: Instalar ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Dependencias
        run: pip install --disable-pip-version-check requests google-auth google-api-python-client
      - name: Verificar y publicar ROMA
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ROMA_MODE: ${{ github.event_name == 'push' && 'publish' || inputs.modo }}
        run: python eon_roma_publicador.py --mode "$ROMA_MODE"
