name: EON-Verso - Shorts automaticos (4 al dia)
on:
  push:
    paths:
      - "eon_shorts_auto.py"
  schedule:
    - cron: "0 14,17,20,23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eon-publicacion-shorts
  cancel-in-progress: false
jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configurar Drive
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          test -n "$RCLONE_CONFIG_BASE64" || { echo "::error::Falta RCLONE_CONFIG_BASE64"; exit 1; }
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes | grep -Fx 'gdrive:'
      - name: Dependencias
        run: pip install --disable-pip-version-check requests google-auth google-api-python-client
      - name: Publicar el siguiente Short en las 3 plataformas
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODE: ${{ github.event_name == 'push' && 'first' || 'scheduled' }}
        run: python eon_shorts_auto.py --mode "$MODE"
