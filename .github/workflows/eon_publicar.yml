name: EON-Verso - YouTube, Facebook y TikTok
on:
  push:
    paths:
      - ".github/workflows/eon_publicar.yml"
      - "eon_publish.py"
      - "eon_shorts.json"
  workflow_dispatch:
    inputs:
      modo:
        description: "Verificar conexiones o publicar Shorts"
        type: choice
        required: true
        default: verify
        options:
          - verify
          - publish
      short:
        description: "Short que se publica; todos publica los 14"
        type: choice
        required: true
        default: perros-01
        options:
          - perros-01
          - perros-02
          - perros-03
          - perros-04
          - perros-05
          - perros-06
          - suenos-01
          - suenos-02
          - suenos-03
          - suenos-04
          - suenos-05
          - suenos-06
          - suenos-07
          - suenos-08
          - todos
      omitir_drive:
        description: "Comprobar conexiones sin leer Drive (solo verify)"
        type: boolean
        default: false
      plataformas:
        description: "Elegir plataformas; TikTok usa Buffer"
        type: choice
        required: true
        default: both
        options:
          - both
          - youtube
          - facebook
          - tiktok
          - all

permissions:
  contents: write
concurrency:
  group: eon-publicacion-shorts
  cancel-in-progress: false

jobs:
  publicar:
    name: Verificar y publicar EON-Verso
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configurar Google Drive
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        shell: bash
        run: |
          test -n "$RCLONE_CONFIG_BASE64" || (echo "::error::Falta RCLONE_CONFIG_BASE64" && exit 1)
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes | grep -Fx 'gdrive:' || (echo "::error::No existe el remoto gdrive:" && exit 1)

      - name: Instalar bibliotecas
        run: pip install --disable-pip-version-check requests google-auth google-api-python-client

      - name: Verificar o publicar
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODE: ${{ github.event_name == 'push' && 'verify' || inputs.modo }}
          SHORT: ${{ github.event_name == 'push' && 'perros-01' || inputs.short }}
          PLATFORMS: ${{ github.event_name == 'push' && 'both' || inputs.plataformas }}
          SKIP_DRIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.omitir_drive || false }}
        run: |
          if [[ "$SKIP_DRIVE" == "true" && "$MODE" == "verify" ]]; then
            python eon_publish.py --mode "$MODE" --short "$SHORT" --platforms "$PLATFORMS" --skip-drive-check
          else
            python eon_publish.py --mode "$MODE" --short "$SHORT" --platforms "$PLATFORMS"
          fi
