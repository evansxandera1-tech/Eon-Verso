name: Todo Mal - Publicar Club Eclipse 1080p con subtitulos ES EN

on:
  push:
    branches: [main]
    paths:
      - 'todo_mal/solicitud_publicacion_club_eclipse.txt'
  workflow_dispatch:
    inputs:
      modo:
        description: "Verificar archivos/permisos o publicar"
        required: true
        type: choice
        default: verificar
        options:
          - verificar
          - publicar
      privacidad:
        description: "Visibilidad final"
        required: true
        type: choice
        default: public
        options:
          - private
          - unlisted
          - public

permissions:
  contents: write

concurrency:
  group: todo-mal-publicar-club-eclipse
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TODOMAL_YOUTUBE_REFRESH_TOKEN: ${{ secrets.TODOMAL_YOUTUBE_REFRESH_TOKEN }}
      TODOMAL_YOUTUBE_CLIENT_ID: ${{ secrets.TODOMAL_YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
      TODOMAL_YOUTUBE_CLIENT_SECRET: ${{ secrets.TODOMAL_YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests google-auth google-api-python-client
      - name: Instalar rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configurar Drive
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        shell: bash
        run: |
          test -n "$RCLONE_CONFIG_BASE64" || (echo "::error::Falta RCLONE_CONFIG_BASE64" && exit 1)
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes | grep -Fx 'gdrive:'
      - name: Verificar canal y reconstruir video antes de subir
        shell: bash
        env:
          MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || 'publicar' }}
          PRIVACIDAD: ${{ github.event_name == 'workflow_dispatch' && inputs.privacidad || 'public' }}
        run: |
          python todo_mal_publicar_club_eclipse.py --modo "$MODO" --privacidad "$PRIVACIDAD"
