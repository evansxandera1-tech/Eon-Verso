name: EON-Verso - Ragnar Pro YouTube y Ojo al Piojo
on:
  push:
    branches: [main]
    paths:
      - "ragnar_publish_once.trigger"
  workflow_dispatch:
    inputs:
      modo:
        description: "verify revisa archivos y cuentas; publish publica y registra"
        type: choice
        options: [verify, publish]
        default: verify
        required: true
permissions:
  contents: write
concurrency:
  group: eon-ragnar-publicacion
  cancel-in-progress: false
jobs:
  publicar_ragnar:
    name: Publicar Ragnar en YouTube y Facebook
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Conectar Drive
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          test -n "$RCLONE_CONFIG_BASE64" || (echo "::error::Falta RCLONE_CONFIG_BASE64" && exit 1)
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes | grep -Fx 'gdrive:'
      - name: Instalar dependencias
        run: pip install --disable-pip-version-check requests google-auth google-api-python-client
      - name: Verificar y publicar
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RAGNAR_MODE: ${{ github.event_name == 'push' && 'publish' || inputs.modo }}
        run: python eon_ragnar_publicador.py --mode "$RAGNAR_MODE"
